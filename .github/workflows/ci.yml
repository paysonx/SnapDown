name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: 运行离线单元测试
        run: python -m pytest backend -v

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  smoke:
    name: 端到端冒烟测试（手动）
    # 冒烟测试会真实访问 B站/抖音解析接口，网络受限时必然失败，
    # 因此不挂到 push/PR 主线上，仅在需要时手动触发（自托管 runner 需能访问这些平台）。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - name: 安装 ffmpeg 与 Playwright Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npx playwright install --with-deps firefox
        working-directory: frontend

      - name: 启动服务
        run: |
          python run.py &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: 运行冒烟测试
        run: node scripts/smoke.mjs
        working-directory: frontend

      - name: 上传冒烟截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: frontend/smoke-screenshots/
          if-no-files-found: ignore